name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NOTE: package-lock.json is regenerated by maintainers via `npm install`
      # after dependency changes, so CI installs rather than `npm ci`.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build
